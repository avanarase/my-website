<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Mobile Website</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #007acc; text-align: center; }
    p { text-align: center; }
  </style>
</head>
<body>
  <head>
  <title>Textbox to Excel</title>
</head>
<body>
  <h2>Enter Data</h2>
  <input type="text" id="myTextbox" placeholder="Type something here..." />
  <button onclick="sendData()">Submit</button>

  <script>
    async function sendData() {
      const value = document.getElementById("myTextbox").value;
      // Send to backend
      await fetch("/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: value })
      });
      alert("Data sent to Excel!");
    }
  </script>

  <h1>Welcome to My Website!</h1>
  <p>This site works on mobile browsers 🚀</p>
  <p>Hello World</p>
  <p>Welcome to mobile browser coding</p>
</body>
</html>
